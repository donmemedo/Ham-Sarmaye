<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ایران‌فاندرز | آفلاین</title>
<style>
  :root { --bg:#f5f5f7; --fg:#1d1d1f; --fg2:#6e6e73; --accent:#0071e3; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --fg2:#a1a1a6; --accent:#2997ff; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
    font-family: "Vazirmatn Variable", Vazirmatn, Tahoma, system-ui, sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  img { width:88px; height:88px; border-radius:22px; box-shadow:0 20px 50px -15px #7c3aed; }
  h1 { font-size:1.5rem; margin:28px 0 8px; } p { color:var(--fg2); margin:4px 0; line-height:1.8; }
  button { margin-top:28px; border:0; border-radius:999px; padding:14px 32px; font:inherit; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p>اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
    <p dir="ltr">You're offline. Check your connection and try again.</p>
    <button onclick="location.reload()">تلاش دوباره · Retry</button>
  </main>
</body>
</html>
