services:
  backend:
    build: ./backend
    ports: ["8038:8000"]
    volumes: [data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["3838:3000"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  data:
