# Builds the Android APK and an unsigned iOS IPA on GitHub's runners (IPA needs macOS/Xcode).
# Run it from the Actions tab and pass the URL where the frontend is deployed.
name: mobile
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed frontend URL the app loads (https://...)"
        required: true

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync -- android
        env: { APP_URL: "${{ inputs.app_url }}" }
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with: { name: IranFunders-apk, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run sync -- ios
        env: { APP_URL: "${{ inputs.app_url }}" }
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
        working-directory: mobile/ios/App
      - run: mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/ && zip -qr IranFunders-unsigned.ipa Payload
        working-directory: mobile/ios/App
      - uses: actions/upload-artifact@v4
        with: { name: IranFunders-ipa, path: mobile/ios/App/IranFunders-unsigned.ipa }
